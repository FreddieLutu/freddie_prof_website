<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freddie Lutu — Senior Data × AI Engineer</title>
  <meta name="description" content="Freddie Lutu — Senior Data × AI Engineer based in London. Making videos and projects tracking a journey through AI, primarily with Claude." />

  <!-- Open Graph / social preview -->
  <meta property="og:title" content="Freddie Lutu" />
  <meta property="og:description" content="Senior Data × AI Engineer based in London." />
  <meta property="og:type" content="profile" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* type */
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

      /* dark palette — cool graphite ground, warm off-white text, teal accent */
      --bg: #0C0E13;
      --bg-elev: #15181F;
      --surface: #171B23;
      --text: #EDEAE4;
      --muted: #9298A4;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #35D6C3;
      --accent-ink: #0C0E13;
      --accent-soft: rgba(53, 214, 195, 0.14);
      --accent-glow: rgba(53, 214, 195, 0.22);
      --grid-dot: rgba(255, 255, 255, 0.035);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ECEEF1;
        --bg-elev: #FFFFFF;
        --surface: #FFFFFF;
        --text: #14171C;
        --muted: #5A616B;
        --border: rgba(16, 20, 28, 0.10);
        --border-strong: rgba(16, 20, 28, 0.20);
        --accent: #0C9A8A;
        --accent-ink: #FFFFFF;
        --accent-soft: rgba(12, 154, 138, 0.12);
        --accent-glow: rgba(12, 154, 138, 0.16);
        --grid-dot: rgba(16, 20, 28, 0.045);
      }
    }

    /* explicit toggle overrides media query in both directions */
    :root[data-theme="light"] {
      --bg: #ECEEF1;
      --bg-elev: #FFFFFF;
      --surface: #FFFFFF;
      --text: #14171C;
      --muted: #5A616B;
      --border: rgba(16, 20, 28, 0.10);
      --border-strong: rgba(16, 20, 28, 0.20);
      --accent: #0C9A8A;
      --accent-ink: #FFFFFF;
      --accent-soft: rgba(12, 154, 138, 0.12);
      --accent-glow: rgba(12, 154, 138, 0.16);
      --grid-dot: rgba(16, 20, 28, 0.045);
    }
    :root[data-theme="dark"] {
      --bg: #0C0E13;
      --bg-elev: #15181F;
      --surface: #171B23;
      --text: #EDEAE4;
      --muted: #9298A4;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #35D6C3;
      --accent-ink: #0C0E13;
      --accent-soft: rgba(53, 214, 195, 0.14);
      --accent-glow: rgba(53, 214, 195, 0.22);
      --grid-dot: rgba(255, 255, 255, 0.035);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.25rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      /* faint engineering dot grid + soft accent glow pooled at top */
      background-image:
        radial-gradient(42rem 28rem at 50% -8%, var(--accent-glow), transparent 70%),
        radial-gradient(var(--grid-dot) 1px, transparent 1px);
      background-size: auto, 22px 22px;
      background-position: center top, center top;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .card {
      width: 100%;
      max-width: 27rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* avatar */
    .avatar {
      position: relative;
      width: 7rem;
      height: 7rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(150deg, var(--surface), var(--bg-elev));
      border: 1px solid var(--border-strong);
      box-shadow: 0 0 0 6px var(--accent-soft), 0 12px 40px -12px var(--accent-glow);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 2.3rem;
      letter-spacing: 0.02em;
      color: var(--text);
      margin-bottom: 1.6rem;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .avatar .status {
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 0.95rem;
      height: 0.95rem;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.65rem;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(2.1rem, 8vw, 2.8rem);
      line-height: 1.04;
      letter-spacing: -0.015em;
      text-wrap: balance;
      margin-bottom: 0.95rem;
    }

    .bio {
      color: var(--muted);
      font-size: 1.02rem;
      max-width: 23rem;
      text-wrap: pretty;
      margin-bottom: 2.2rem;
    }
    .bio strong { color: var(--text); font-weight: 600; }

    /* social icon row */
    .socials {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
    }
    .social {
      position: relative;
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                  color 0.22s ease, border-color 0.22s ease,
                  background-color 0.22s ease, box-shadow 0.22s ease;
    }
    .social svg { width: 1.4rem; height: 1.4rem; display: block; }
    .social:hover,
    .social:focus-visible {
      transform: translateY(-4px);
      color: var(--accent-ink);
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 10px 24px -8px var(--accent-glow);
    }
    .social:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* tooltip label */
    .social::after {
      content: attr(data-label);
      position: absolute;
      bottom: calc(100% + 0.5rem);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: var(--text);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
      border-radius: 0.4rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .social:hover::after,
    .social:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      margin-top: 2.6rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* theme toggle */
    .theme-toggle {
      position: fixed;
      top: 1.1rem;
      right: 1.1rem;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .theme-toggle:hover { color: var(--text); border-color: var(--border-strong); transform: rotate(-12deg); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-toggle svg { width: 1.15rem; height: 1.15rem; }
    .theme-toggle .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon { display: block; }
    :root[data-theme="dark"] .theme-toggle .sun { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .moon { display: block; }
      :root:not([data-theme="light"]) .theme-toggle .sun { display: none; }
    }

    /* entrance animation */
    @media (prefers-reduced-motion: no-preference) {
      .reveal { opacity: 0; transform: translateY(14px); animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .reveal:nth-child(1) { animation-delay: 0.05s; }
      .reveal:nth-child(2) { animation-delay: 0.13s; }
      .reveal:nth-child(3) { animation-delay: 0.21s; }
      .reveal:nth-child(4) { animation-delay: 0.29s; }
      .reveal:nth-child(5) { animation-delay: 0.37s; }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle colour theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
  </button>

  <main class="card">
    <!-- To use a photo instead of the monogram, replace the FL span with:
         <img src="your-photo.jpg" alt="Freddie Lutu" /> -->
    <div class="avatar reveal" aria-hidden="true">
      <span>FL</span>
      <span class="status" title="Available"></span>
    </div>

    <p class="eyebrow reveal">Senior Data × AI Engineer · London</p>

    <h1 class="reveal">Freddie Lutu</h1>

    <p class="bio reveal">
      Senior Data&nbsp;×&nbsp;AI Engineer based in London. I make videos and personal
      projects to track my journey keeping up with AI trends — primarily with
      <strong>Claude</strong>.
    </p>

    <nav class="socials reveal" aria-label="Social links">
      <a class="social" href="mailto:freddielutu@gmail.com" data-label="Email" aria-label="Email Freddie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
          <path d="M3 6.5l9 6.5 9-6.5" />
        </svg>
      </a>
      <a class="social" href="https://www.linkedin.com/in/freddieblutu/" target="_blank" rel="noopener noreferrer" data-label="LinkedIn" aria-label="Freddie on LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.82-2.05 3.75-2.05C20.4 8.65 21 11.2 21 14.1V21h-4v-6.1c0-1.45-.03-3.32-2.02-3.32-2.02 0-2.33 1.58-2.33 3.21V21H9z" />
        </svg>
      </a>
      <a class="social" href="https://www.instagram.com/freddielutu/" target="_blank" rel="noopener noreferrer" data-label="Instagram" aria-label="Freddie on Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none" />
        </svg>
      </a>
    </nav>

    <footer class="reveal">© 2026 Freddie Lutu</footer>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("themeToggle");
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) {}
      if (stored === "light" || stored === "dark") root.setAttribute("data-theme", stored);

      toggle.addEventListener("click", function () {
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var current = root.getAttribute("data-theme") || (prefersDark ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
